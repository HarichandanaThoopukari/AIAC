<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Gallery</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #333;
      }

      body {
        margin: 0;
        padding: 2rem;
      }

      h1 {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }

      .gallery img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .gallery img:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 1rem;
      }

      .modal.show {
        display: flex;
      }

      .modal img {
        max-width: 90vw;
        max-height: 80vh;
        border-radius: 10px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      }

      .modal button {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: #fff;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <h1>AI-Assisted Image Gallery</h1>
    <section class="gallery">
      <img
        src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=60"
        alt="Mountain landscape"
      />
      <img
        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=60"
        alt="Forest trail"
      />
      <img
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=60"
        alt="Desert dunes"
      />
      <img
        src="https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=900&q=60"
        alt="Ocean waves"
      />
      <img
        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=60"
        alt="Autumn leaves"
      />
      <img
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=60"
        alt="Snowy mountains"
      />
      <img
        src="https://images.unsplash.com/photo-1443890923422-7819ed4101c0?auto=format&fit=crop&w=900&q=60"
        alt="City skyline"
      />
      <img
        src="https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=900&q=60"
        alt="Hot air balloons"
      />
      <img
        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=60"
        alt="Starry night"
      />
    </section>

    <div class="modal" id="imageModal">
      <button id="closeModal" aria-label="Close preview">&times;</button>
      <img src="" alt="Expanded view" id="modalImage" />
    </div>

    <script>
      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");
      const closeButton = document.getElementById("closeModal");

      document.querySelectorAll(".gallery img").forEach((img) => {
        img.addEventListener("click", () => {
          modalImage.src = img.src;
          modalImage.alt = img.alt;
          modal.classList.add("show");
        });
      });

      const closeModal = () => modal.classList.remove("show");

      closeButton.addEventListener("click", closeModal);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("show")) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
